services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata18:/var/lib/postgresql  # PG18+ image keeps data in a versioned subdir
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://readonly:readonly@postgres:5432/analytics
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL_ANTHROPIC: ${LLM_MODEL_ANTHROPIC:-}
      LLM_MODEL_OPENAI: ${LLM_MODEL_OPENAI:-}
      LLM_MODEL_GEMINI: ${LLM_MODEL_GEMINI:-}
      GEMINI_REASONING_EFFORT: ${GEMINI_REASONING_EFFORT:-low}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
      ENABLE_AI_REVIEW: ${ENABLE_AI_REVIEW:-true}
      MAX_ROWS: ${MAX_ROWS:-1000}
      MAX_SUBQUERY_DEPTH: ${MAX_SUBQUERY_DEPTH:-3}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-30}
      MIN_CONFIDENCE_TO_EXECUTE: ${MIN_CONFIDENCE_TO_EXECUTE:-0.3}
      HALLUCINATION_FLAG_THRESHOLD: ${HALLUCINATION_FLAG_THRESHOLD:-0.5}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-100}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      ENABLE_LIVE_EVALS: ${ENABLE_LIVE_EVALS:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata18:
